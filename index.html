<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Central de Dashboards | Marcas Auto</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #15171c;
        --muted: #666b76;
        --line: #d9dee8;
        --page: #f4f6f9;
        --panel: #ffffff;
        --panel-2: #eef2f6;
        --accent: #176b87;
        --accent-2: #c84b31;
        --ok: #167a47;
        --warn: #9b5d00;
        --shadow: 0 18px 45px rgba(22, 32, 48, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          linear-gradient(135deg, rgba(23, 107, 135, 0.15), transparent 35%),
          linear-gradient(315deg, rgba(200, 75, 49, 0.12), transparent 38%),
          var(--page);
      }

      button,
      input,
      a {
        font: inherit;
      }

      .app {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 42px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 26px;
      }

      .brand-mark {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }

      .identity-logos {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 0 0 auto;
      }

      .identity-logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 58px;
        height: 58px;
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 8px 22px rgba(27, 37, 52, 0.08);
      }

      .garden-logo {
        background: #dd101f;
      }

      .hub-logo {
        background: #ff640b;
      }

      .hub-logo img {
        filter: brightness(0) invert(1);
      }

      .identity-logo svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .identity-logo img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      .identity-logo.hub-logo img {
        width: 76%;
        height: 76%;
        object-fit: contain;
      }

      .title-block {
        min-width: 0;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.55rem, 3vw, 2.35rem);
        line-height: 1.05;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.98rem;
      }

      .toolbar {
        display: flex;
        align-items: center;
        margin-bottom: 22px;
      }

      .search {
        position: relative;
        width: min(100%, 420px);
      }

      .search svg {
        position: absolute;
        left: 13px;
        top: 50%;
        width: 18px;
        height: 18px;
        transform: translateY(-50%);
        color: var(--muted);
      }

      .search input {
        width: 100%;
        height: 44px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.88);
        padding: 0 14px 0 42px;
        outline: none;
        color: var(--ink);
        box-shadow: 0 10px 26px rgba(27, 37, 52, 0.06);
      }

      .search input:focus {
        border-color: rgba(23, 107, 135, 0.65);
        box-shadow: 0 0 0 4px rgba(23, 107, 135, 0.13);
      }

      /* Featured section (Multimarca) */
      .featured {
        margin-bottom: 28px;
      }

      .section-label {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .section-label::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }

      .card-featured {
        position: relative;
        display: block;
        text-decoration: none;
        color: inherit;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid rgba(23, 107, 135, 0.35);
        background:
          radial-gradient(circle at 0% 0%, rgba(23, 107, 135, 0.18), transparent 55%),
          radial-gradient(circle at 100% 100%, rgba(200, 75, 49, 0.16), transparent 55%),
          linear-gradient(180deg, #ffffff, #f7fafc);
        box-shadow: 0 16px 40px rgba(23, 107, 135, 0.14);
        transition:
          transform 180ms ease,
          box-shadow 180ms ease,
          border-color 180ms ease;
      }

      .card-featured:hover {
        transform: translateY(-3px);
        border-color: rgba(23, 107, 135, 0.6);
        box-shadow: 0 22px 52px rgba(23, 107, 135, 0.2);
      }

      .featured-inner {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 22px;
        padding: 22px 24px;
      }

      .featured-icon {
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--accent), #1f8aab);
        color: #fff;
        box-shadow: 0 10px 24px rgba(23, 107, 135, 0.35);
      }

      .featured-icon svg {
        width: 38px;
        height: 38px;
      }

      .featured-body h2 {
        margin: 0 0 4px;
        font-size: 1.45rem;
        line-height: 1.15;
      }

      .featured-body .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(23, 107, 135, 0.12);
        color: var(--accent);
        font-size: 0.72rem;
        font-weight: 750;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .featured-body p {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
        max-width: 56ch;
      }

      .featured-cta {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 18px;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-weight: 750;
        white-space: nowrap;
      }

      .featured-cta svg {
        width: 18px;
        height: 18px;
      }

      /* End featured */

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .card {
        position: relative;
        min-height: 214px;
        border: 1px solid rgba(217, 222, 232, 0.95);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.9)),
          var(--panel);
        box-shadow: 0 12px 34px rgba(27, 37, 52, 0.09);
        overflow: hidden;
        transition:
          transform 180ms ease,
          box-shadow 180ms ease,
          border-color 180ms ease;
      }

      .card[data-ready="true"]:hover {
        transform: translateY(-3px);
        border-color: rgba(23, 107, 135, 0.45);
        box-shadow: var(--shadow);
      }

      .card-inner {
        display: flex;
        min-height: 214px;
        flex-direction: column;
        justify-content: space-between;
        padding: 18px;
        text-decoration: none;
        color: inherit;
      }

      .card[data-ready="false"] .card-inner {
        cursor: not-allowed;
      }

      .logo-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
      }

      .logo-box {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 68px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-2);
        padding: 13px;
      }

      .logo-box.duo {
        gap: 10px;
      }

      .logo-box.wide {
        width: 126px;
        padding: 10px 12px;
      }

      .logo-box img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.65));
      }

      .logo-box.duo img {
        width: 38px;
        max-width: 42%;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 6px 9px;
        font-size: 0.76rem;
        font-weight: 750;
        color: var(--ok);
        background: rgba(22, 122, 71, 0.1);
      }

      .status.missing {
        color: var(--warn);
        background: rgba(155, 93, 0, 0.11);
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: currentColor;
      }

      .card h2 {
        margin: 18px 0 6px;
        font-size: 1.33rem;
        line-height: 1.15;
        letter-spacing: 0;
      }

      .card p {
        margin: 0;
        color: var(--muted);
        font-size: 0.93rem;
      }

      .action {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-top: 20px;
        border-top: 1px solid var(--line);
        padding-top: 14px;
        color: var(--accent);
        font-weight: 780;
      }

      .card[data-ready="false"] {
        background: rgba(255, 255, 255, 0.62);
      }

      .card[data-ready="false"] .logo-box,
      .card[data-ready="false"] h2,
      .card[data-ready="false"] p {
        opacity: 0.62;
      }

      .card[data-ready="false"] .action {
        color: var(--muted);
      }

      .arrow {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: rgba(23, 107, 135, 0.1);
      }

      .empty {
        display: none;
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 22px;
        background: rgba(255, 255, 255, 0.72);
        color: var(--muted);
      }

      .empty.show {
        display: block;
      }

      @media (max-width: 720px) {
        .app {
          width: min(100% - 22px, 1180px);
          padding-top: 20px;
        }

        .topbar {
          display: grid;
          grid-template-columns: 1fr;
        }

        .brand-mark {
          align-items: flex-start;
        }

        .identity-logo {
          width: 48px;
          height: 48px;
        }

        .featured-inner {
          grid-template-columns: 1fr;
          text-align: left;
          gap: 16px;
          padding: 20px;
        }

        .featured-cta {
          justify-self: start;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

          </div>

      </header>

      <section class="toolbar" aria-label="Herramientas">
        <label class="search">

          <input id="search" type="search" placeholder="Buscar marca" autocomplete="off" />

      </section>

      <section id="featured" class="featured" aria-label="Dashboard destacado">

          <div class="featured-inner">
            <div class="featured-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="9" rx="1.5" />
                <rect x="14" y="3" width="7" height="5" rx="1.5" />
                <rect x="14" y="12" width="7" height="9" rx="1.5" />
                <rect x="3" y="16" width="7" height="5" rx="1.5" />
              </svg>
            </div>
            <div class="featured-body">
              <span class="tag">
                <span class="status-dot" aria-hidden="true" style="background: var(--accent)"></span>
                Multimarca
              </span>
              <h2>Dashboard Multimarca</h2>
              <p>Vista consolidada de performance y métricas de todas las marcas del grupo en un solo lugar.</p>
            </div>
            <span class="featured-cta">
              Abrir dashboard
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M7 17 17 7M9 7h8v8" />
              </svg>
            </span>
          </div>
        </a>
      </section>

      <p class="section-label">Por marca</p>
      <section id="grid" class="grid" aria-live="polite"></section>
      <p id="empty" class="empty">No encontré marcas con esa búsqueda.</p>
    </main>

      const grid = document.querySelector("#grid");
      const empty = document.querySelector("#empty");
      const search = document.querySelector("#search");
      const featured = document.querySelector("#featured");

      const logoUrl = (slug) => `https://cdn.simpleicons.org/${slug}/15171C`;

      function fallbackLogo(img, name) {
        const initials = name
          .split(/\s|\/+/)
          .filter(Boolean)
          .map((word) => word[0])
          .slice(0, 2)
          .join("")
          .toUpperCase();
        img.replaceWith(document.createTextNode(initials));
      }

      function logoMarkup(item) {
        if (item.logoSrc) {
          const className = item.logoWide ? "logo-box wide" : "logo-box";
          return `<div class="${className}">
            <img src="${item.logoSrc}" alt="Logo ${item.name}" onerror="fallbackLogo(this, '${item.name}')" />
          </div>`;
        }

        const slugs = Array.isArray(item.slug) ? item.slug : [item.slug];
        const className = slugs.length > 1 ? "logo-box duo" : "logo-box";
        const logos = slugs
          .map(
            (slug) =>
              `<img src="${logoUrl(slug)}" alt="Logo ${item.name}" onerror="fallbackLogo(this, '${item.name}')" />`,
          )
          .join("");
        return `<div class="${className}">${logos}</div>`;
      }

      function cardMarkup(item) {
        const ready = Boolean(item.url);
        const status = ready ? "Disponible" : "Falta link";
        const body = `
          <div>
            <div class="logo-row">
              ${logoMarkup(item)}
              <span class="status ${ready ? "" : "missing"}">
                <span class="status-dot" aria-hidden="true"></span>${status}
              </span>
            </div>
            <h2>${item.name}</h2>
            <p>${ready ? "Dashboard de performance y métricas." : "Pendiente de cargar el acceso."}</p>
          </div>
          <div class="action">
            <span>${ready ? "Abrir dashboard" : "Sin acceso cargado"}</span>
            <span class="arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path d="M7 17 17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
          </div>
        `;

        if (!ready) {
          return `<article class="card" data-ready="false" data-name="${item.name.toLowerCase()}"><div class="card-inner" aria-disabled="true">${body}</div></article>`;
        }

        return `<article class="card" data-ready="true" data-name="${item.name.toLowerCase()}"><a class="card-inner" href="${item.url}" target="_blank" rel="noreferrer noopener" aria-label="Abrir dashboard de ${item.name}">${body}</a></article>`;
      }

      function render() {
        const query = search.value.trim().toLowerCase();
        const filtered = dashboards.filter((item) => item.name.toLowerCase().includes(query));
        grid.innerHTML = filtered.map(cardMarkup).join("");
        empty.classList.toggle("show", filtered.length === 0);

        // Ocultar la tarjeta destacada si el usuario está buscando una marca específica
        const isSearching = query.length > 0;
        featured.style.display = isSearching ? "none" : "";
      }

      search.addEventListener("input", render);
      render();
    </script>
